[project]
name = "bikeshare"
version = "0.1.0"
description = "Decision-analytics case study in bike-sharing demand"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "altair>=6.2.2",
    "polars",
]

[build-system]
requires = ["uv_build<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ipykernel", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py314"
fix = true

[tool.ruff.lint]
extend-select = ["I", "RUF022"]
